[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bunker"
version = "0.2.0"
description = "Sovereign serving layer for coding agents: one GPU, one charter, a context budget the server actually counts."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Warith Harchaoui", email = "warithmetics@deraison.ai" }]
keywords = ["llm", "vllm", "gateway", "openai-compatible", "sovereignty", "coding-agent", "context-budget"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

# The suite does the heavy lifting: hardware detection, model selection and the
# Ollama-vs-vLLM rule are not reimplemented here.
dependencies = [
  "os-helper>=0.1",
  "best-engine-ai-helper>=1.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# The gateway surface. Not needed on a machine that only runs `sizing`/`doctor`.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
mcp = ["fastapi-mcp>=0.1"]
# Real tokenizer counting. Without it, budget falls back to a declared
# characters-per-token ratio and SAYS SO rather than pretending to be exact.
tokenizers = ["tokenizers>=0.15"]
serve = ["vllm>=0.28"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]
all = ["ai-bunker[api,mcp,tokenizers,dev]"]

[project.scripts]
ai-bunker = "ai_bunker.cli:main"

[project.urls]
Homepage = "https://deraison.ai/ai-helpers"
Source = "https://github.com/warith-harchaoui/ai-bunker"

[tool.setuptools.packages.find]
include = ["ai_bunker*"]

[tool.setuptools.package-data]
ai_bunker = ["py.typed", "static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The page modules hold HTML prose, not code. RUF001 exists to catch look-alike
# characters in identifiers; in a paragraph about numbers, a true minus sign
# (U+2212) in a formula and an en dash in "3.10-3.13" are the correct glyphs,
# and replacing them with a hyphen would make the typography worse to satisfy a
# rule aimed at a different problem.
"web/pages/*.py" = ["RUF001"]

# These two are *about* confusable characters, so they have to contain them.
# RUF001 and RUF002 exist to stop a Cyrillic о sneaking into an identifier;
# here the Cyrillic о is the subject matter -- the confusables table, the
# payloads that bypassed the rules, and the prose explaining why. A linter
# cannot tell a specimen from a mistake, so the exemption is scoped to the two
# files that hold specimens and nowhere else.
"ai_bunker/invisible.py" = ["RUF001", "RUF002"]
"tests/test_invisible.py" = ["RUF001", "RUF002"]
# Same exemption, same reason: a look-alike name is the specimen under test.
"ai_bunker/tools.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_tools.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# `py.typed` ships in `package-data`, which is a promise to every downstream
# project that runs a type checker that the annotations here are meant to be
# believed. A promise with no gate behind it is the thing this repository
# refuses everywhere else, so `mypy` runs in CI beside `ruff`, and
# `tests/test_site.py` fails if the marker ever ships without the step.
python_version = "3.10"
files = ["ai_bunker"]

# Three upstreams ship no stubs and no `py.typed`. Silenced by name rather
# than with `ignore_missing_imports = true`, so a fourth untyped dependency
# arriving is a failure to look at rather than a silence to inherit:
#
#   os-helper, best-engine-ai-helper  -- the suite's own packages, typed
#                                        in source but not yet marked
#   fastapi-mcp                       -- third party, installed, unmarked
[[tool.mypy.overrides]]
module = ["os_helper.*", "best_engine_ai_helper.*", "fastapi_mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Third-party pytest plugins installed in the ambient environment are loaded
# into every run whether or not a project uses them. Four of them cost this
# suite roughly eight seconds per invocation and contribute nothing here, so
# they are switched off: a slow test suite is a test suite people stop running.
# anyio stays: starlette's TestClient needs it.
addopts = "-q -p no:deepeval -p no:langsmith_plugin -p no:hydra_pytest -p no:faker"
