[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bunker"
version = "0.2.0"
description = "Sovereign serving layer for coding agents: one GPU, one charter, a context budget the server actually counts."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Warith Harchaoui", email = "warithmetics@deraison.ai" }]
keywords = ["llm", "vllm", "gateway", "openai-compatible", "sovereignty", "coding-agent", "context-budget"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

# The suite does the heavy lifting: hardware detection, model selection and the
# Ollama-vs-vLLM rule are not reimplemented here.
dependencies = [
  "os-helper>=0.1",
  # Floored at 1.10 for `imagine_rank`/`imagine_pick`, the text-to-image
  # selector this project delegates the whole slot to. They existed only on
  # the provider's development branch for several releases, so seven tests
  # skipped under every published version and the lane compensated with two
  # steps that cloned that branch. 1.10.0 publishes them -- verified in a
  # clean environment against the wheel from the package index, not against
  # the maintainer's editable checkout -- so the floor rises and those two
  # steps are gone. `tests/test_engine.py` holds the floor to that promise.
  "best-engine-ai-helper>=1.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# The gateway surface. Not needed on a machine that only runs `sizing`/`doctor`.
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
mcp = ["fastapi-mcp>=0.1"]
# Real tokenizer counting. Without it, budget falls back to a declared
# characters-per-token ratio and SAYS SO rather than pretending to be exact.
tokenizers = ["tokenizers>=0.15"]
serve = ["vllm>=0.28"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "types-PyYAML>=6"]
all = ["ai-bunker[api,mcp,tokenizers,dev]"]

[project.scripts]
ai-bunker = "ai_bunker.cli:main"

[project.urls]
Homepage = "https://deraison.ai/ai-helpers"
Source = "https://github.com/warith-harchaoui/ai-bunker"

[tool.setuptools.packages.find]
include = ["ai_bunker*"]

[tool.setuptools.package-data]
ai_bunker = ["py.typed", "static/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The page modules hold HTML prose, not code. RUF001 exists to catch look-alike
# characters in identifiers; in a paragraph about numbers, a true minus sign
# (U+2212) in a formula and an en dash in "3.10-3.13" are the correct glyphs,
# and replacing them with a hyphen would make the typography worse to satisfy a
# rule aimed at a different problem.
"web/pages/*.py" = ["RUF001"]

# These two are *about* confusable characters, so they have to contain them.
# RUF001 and RUF002 exist to stop a Cyrillic о sneaking into an identifier;
# here the Cyrillic о is the subject matter -- the confusables table, the
# payloads that bypassed the rules, and the prose explaining why. A linter
# cannot tell a specimen from a mistake, so the exemption is scoped to the two
# files that hold specimens and nowhere else.
"ai_bunker/invisible.py" = ["RUF001", "RUF002"]
"tests/test_invisible.py" = ["RUF001", "RUF002"]
# Same exemption, same reason: a look-alike name is the specimen under test.
"ai_bunker/tools.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_tools.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# `py.typed` ships in `package-data`, which is a promise to every downstream
# project that runs a type checker that the annotations here are meant to be
# believed. A promise with no gate behind it is the thing this repository
# refuses everywhere else, so `mypy` runs in CI beside `ruff`, and
# `tests/test_site.py` fails if the marker ever ships without the step.
python_version = "3.10"
files = ["ai_bunker"]

# Three upstreams ship no stubs and no `py.typed`. Silenced by name rather
# than with `ignore_missing_imports = true`, so a fourth untyped dependency
# arriving is a failure to look at rather than a silence to inherit:
#
#   os-helper, best-engine-ai-helper  -- the suite's own packages, typed
#                                        in source but not yet marked
#   fastapi-mcp                       -- third party, installed, unmarked
#   tokenizers                        -- an optional extra: absent from the
#                                        lane on purpose, because the point of
#                                        the extra is that the package works
#                                        without it
#
# `types-PyYAML` is NOT in this list and must not be: stubs exist for PyYAML,
# so the honest fix was to install them. They are in `[dev]`.
[[tool.mypy.overrides]]
module = [
  "os_helper.*",
  "best_engine_ai_helper.*",
  "fastapi_mcp.*",
  "tokenizers.*",
]
ignore_missing_imports = true

[tool.coverage.run]
# The shipped package, and only it. `scripts/` was in this list for one
# commit and the reasoning was better than the result: six of those files are
# gates, and a gate whose own code is untested can pass by being broken. But
# the directory also holds developer tools that cannot run in a suite --
# `bench_context.py` needs a live engine, `verify_deployment.py` needs a
# deployment -- and counting them at 0% dropped the total four points and
# would have had the floor defending a number that says nothing about
# `ai_bunker`. The gates are covered through their own tests
# (`test_figures.py`, `test_claims.py`, `test_acronyms.py`); the floor below
# is about the wheel, which is what `py.typed` makes a promise about.
source = ["ai_bunker"]

[tool.coverage.report]
# Measured at 92.09% when the gate was added, over 5,523 statements -- which
# is `ai_bunker` plus the handful of `scripts/` modules the suite imports by
# path to test them. `source` above drops the scripts nothing imports; it
# cannot drop the ones that are imported, and it should not: those are the
# gates, and they are being exercised.
#
# The floor is set a little under that rather than at it: a floor equal to the
# measurement turns every honest refactor into a red build, and a floor that
# cannot be cleared without gaming it is a floor people delete. Raise it when
# the number rises; never lower it to make a branch pass.
fail_under = 90
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Third-party pytest plugins installed in the ambient environment are loaded
# into every run whether or not a project uses them. Four of them cost this
# suite roughly eight seconds per invocation and contribute nothing here, so
# they are switched off: a slow test suite is a test suite people stop running.
# anyio stays: starlette's TestClient needs it.
addopts = "-q -p no:deepeval -p no:langsmith_plugin -p no:hydra_pytest -p no:faker"

# One marker, for tests whose answer cannot depend on the interpreter: the
# linters that read committed files, the figure audit, the film spec, the
# handoff gate, the published-figure check. The suite runs on 3.10 and 3.13,
# so without this they are paid for twice -- which is the argument `ci.yml`
# already makes, in prose, for keeping lint, format, rules and the page audits
# in a `gate` job that runs once. This is the same argument applied to the
# gates that live inside the suite rather than beside it.
#
# Measured, and measured in the lane, because this machine could not. Two
# back-to-back rehearsals of one unchanged tree put the saving at 8.6 seconds
# and then at 1.4, the maintainer's machine running other sessions throughout.
# A number that moves by a factor of six between two readings has been
# sampled, not measured, and a projected figure is the one thing this
# repository does not let itself publish.
#
# The lane is the quiet machine. Its 3.10 `Tests` step took 63, 63 and 69
# seconds over the three runs before this one; it takes 44 now. So: about 19
# seconds off a 63-second leg.
#
# What that 19 does not say, because one run cannot separate it: two changes
# land on this leg at once. The deselection is one. The other is that the two
# `test_site.py` tests it deselects were the only callers of a
# `--collect-only` subprocess that re-imports the whole suite, so the leg
# stopped paying for that too. 19 seconds is what the round took off 3.10,
# not what the marker took off alone.
#
# What it gives up, stated rather than implied: a defect that appears when one
# of those gates runs under 3.10 and not under 3.13 would now reach a release.
# None of them has version-conditional code, and `scripts/` is not shipped in
# the wheel at all -- but the window is real and this is where it is written
# down.
markers = [
  "gate: a check whose answer cannot differ by interpreter; run once, on the newest",
]
