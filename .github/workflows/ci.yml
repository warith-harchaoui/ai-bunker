name: CI

on:
  push:
    # Both names on purpose. The workflow said `main` while the repository's
    # branch was `master`, so CI had never run once -- on a project whose
    # README advertises a green gate. Accepting both is cheaper than imposing
    # a rename, and it cannot silently stop working again.
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite, on the two interpreters that bound what `pyproject.toml`
  # declares: `>=3.10,<3.14`.
  #
  # It was all four, and every leg also ran the seven checks below -- lint,
  # format, rules, three page audits and doctor -- none of which can produce a
  # different answer on a different interpreter. So the lane paid four times
  # for one result, and each of those four also paid for the 196-megabyte torch
  # wheel the step below no longer downloads.
  #
  # What the trim gives up is stated rather than implied: a bug that appears
  # on 3.11 or 3.12 and on neither 3.10 nor 3.13 would now reach a release.
  # That is a narrow window -- the project has no version-conditional code and
  # no C extension of its own -- and it is the trade a light lane is.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Keyed on the file that declares the dependencies. GitHub's cache is
          # immutable per key: without this, a key that stops describing the
          # environment keeps restoring the entry it was saved with and never
          # re-saves.
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,dev]"

      # A guard, not a workaround, and it replaces one.
      #
      # This lane used to pre-install the processor-only build of torch from
      # PyTorch's own index, with a comment claiming the line was "a no-op
      # while the published helper has no torch in its base dependencies". It
      # was not a no-op: `pip install torch` installs torch whether or not
      # anything wants it -- and no published best-engine-ai-helper has ever
      # asked for it. 1.7.0 through 1.9.0 declare click, langdetect, os-helper,
      # psutil, pyyaml, requests, fastapi, uvicorn, fastapi-mcp and mcp, with
      # torch and friends behind extras this lane does not install. Nothing in
      # `ai_bunker/`, `tests/` or `scripts/` names torch either. So every leg
      # downloaded a 196-megabyte wheel and spent twenty-one seconds unpacking
      # it, for nothing. Measured without it: 1,102 pass, 8 skip.
      #
      # The reason behind the old line still stands, so it is kept as a check
      # rather than as a download. ai-bunker is a proxy that never loads a
      # model; torch has no business here. It is one `pyproject.toml` edit away
      # in the helper, and the Linux torch wheel on the package index is the
      # build for NVIDIA's Compute Unified Device Architecture -- gigabytes of
      # nvidia-* payload for a runner with no graphics processor. This fails
      # the day that happens, loudly, naming the two ways out, because which
      # one to take is a decision somebody should make rather than a lane that
      # silently grows by gigabytes.
      - name: No deep-learning stack
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          heavy = [n for n in ("torch", "transformers", "diffusers") if importlib.util.find_spec(n)]
          if heavy:
              sys.exit(
                  f"{', '.join(heavy)} was pulled into this lane. Nothing here loads a "
                  "model, so either drop the dependency that asks for it, or "
                  "pre-install the CPU build first:\n"
                  "  pip install --index-url https://download.pytorch.org/whl/cpu torch\n"
                  "(--index-url, not --extra-index-url: with two indexes offering the "
                  "same version, which one pip picks is not a documented guarantee.)"
              )
          PY

      - name: Tests
        run: pytest -q

  # Everything whose answer does not depend on the interpreter, once.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,dev]"

      # The whole tree, `web/` included: the page modules are Python that
      # assembles the site, and a carve-out is a rule nobody remembers.
      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # The rules ship with their own examples, so the rule set is itself
      # under test. A regular expression that silently stops matching is a
      # guardrail that silently disappears, and this is what catches it.
      - name: Rule evidence
        run: ai-bunker rules --check

      # The dashboard's two gates. Deterministic, no browser, no model.
      - name: Dashboard contrast
        run: python scripts/audit_contrast.py

      - name: Dashboard accessibility
        run: python scripts/lint_a11y.py

      # The site's figures are a separate problem: their text sits on tints of
      # the brand colours themselves, so a token that passes against white can
      # fail against its own card. The failures are light-scheme-only, which is
      # precisely what a review done in dark mode cannot see.
      - name: Figure contrast
        run: python scripts/audit_figures.py

      # A deployment claim that nobody checks is a deployment claim that
      # drifts. `doctor` returns non-zero only on a broken rule set, so an
      # unreachable upstream in CI is a warning rather than a failure.
      - name: Doctor
        run: ai-bunker doctor --config config/gateway.example.yaml
