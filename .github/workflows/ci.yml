name: CI

on:
  push:
    # Both names on purpose. The workflow said `main` while the repository's
    # branch was `master`, so CI had never run once -- on a project whose
    # README advertises a green gate. Accepting both is cheaper than imposing
    # a rename, and it cannot silently stop working again.
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # torch is not a dependency of this project and never will be: this
          # is a proxy that never loads a model. It arrives anyway, through
          # best-engine-ai-helper, which carries `airllm` as a core dependency
          # for layer streaming -- and PyPI's Linux torch wheel is the CUDA
          # build, gigabytes of nvidia-* payload for a runner with no GPU.
          #
          # Pre-installing the CPU build satisfies the requirement first, so
          # the project install below resolves against it instead of fetching
          # the CUDA one. Same reasoning and same line as the sibling package's
          # own lane, deliberately: two repositories solving one problem two
          # ways is how one of them silently gets slow again.
          #
          # `--index-url`, not `--extra-index-url`: with two indexes offering
          # the same version, which one pip picks is not a documented
          # guarantee, and a lane whose download size depends on resolver luck
          # is a lane that regresses without anyone editing it.
          #
          # It is a no-op while the published helper has no torch in its base
          # dependencies, and it is what stops this lane growing by gigabytes
          # on the day that changes. `|| true`, because a resolver that cannot
          # place the CPU wheel on some future Python must not fail the build
          # before the real install has been tried.
          pip install --index-url https://download.pytorch.org/whl/cpu torch || true
          pip install -e ".[api,mcp,dev]"

      # The whole tree, `web/` included: the page modules are Python that
      # assembles the site, and a carve-out is a rule nobody remembers.
      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      # The rules ship with their own examples, so the rule set is itself
      # under test. A regular expression that silently stops matching is a
      # guardrail that silently disappears, and this is what catches it.
      - name: Rule evidence
        run: ai-bunker rules --check

      # The dashboard's two gates. Deterministic, no browser, no model.
      - name: Dashboard contrast
        run: python scripts/audit_contrast.py

      - name: Dashboard accessibility
        run: python scripts/lint_a11y.py

      # The site's figures are a separate problem: their text sits on tints of
      # the brand colours themselves, so a token that passes against white can
      # fail against its own card. The failures are light-scheme-only, which is
      # precisely what a review done in dark mode cannot see.
      - name: Figure contrast
        run: python scripts/audit_figures.py

      # A deployment claim that nobody checks is a deployment claim that
      # drifts. `doctor` returns non-zero only on a broken rule set, so an
      # unreachable upstream in CI is a warning rather than a failure.
      - name: Doctor
        run: ai-bunker doctor --config config/gateway.example.yaml
