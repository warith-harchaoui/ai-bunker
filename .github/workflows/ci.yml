name: CI

on:
  push:
    # Both names on purpose. The workflow said `main` while the repository's
    # branch was `master`, so CI had never run once -- on a project whose
    # README advertises a green gate. Accepting both is cheaper than imposing
    # a rename, and it cannot silently stop working again.
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite, on the two interpreters that bound what `pyproject.toml`
  # declares: `>=3.10,<3.14`.
  #
  # It was all four, and every leg also ran the seven checks below -- lint,
  # format, rules, three page audits and doctor -- none of which can produce a
  # different answer on a different interpreter. So the lane paid four times
  # for one result, and each of those four also paid for the 196-megabyte torch
  # wheel the step below no longer downloads.
  #
  # What the trim gives up is stated rather than implied: a bug that appears
  # on 3.11 or 3.12 and on neither 3.10 nor 3.13 would now reach a release.
  # That is a narrow window -- the project has no version-conditional code and
  # no C extension of its own -- and it is the trade a light lane is.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Keyed on the file that declares the dependencies. GitHub's cache is
          # immutable per key: without this, a key that stops describing the
          # environment keeps restoring the entry it was saved with and never
          # re-saves.
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,dev]"

      # A guard, not a workaround, and it replaces one. The whole argument --
      # why a proxy must not carry torch, and why the old pre-install line was
      # downloading 196 megabytes per leg to prove it -- is in the script's own
      # docstring, where it is readable without opening a workflow file.
      - name: No deep-learning stack
        run: python scripts/no_heavy_stack.py

      # One run, two answers. Coverage was a second step here for exactly one
      # commit, and a second step means a second full suite: the lane paid
      # twice to learn one number. `--cov` on the leg that already runs is
      # free, and only on 3.13 because the figure cannot differ by interpreter
      # for a pure-Python package -- the same argument as the matrix trim
      # above. The floor lives in `pyproject.toml`, where `coverage` reads it
      # whoever invokes it, rather than in a flag one `-p` can remove.
      # `-m "not gate"` on the older leg. Five test modules and two tests in a
      # sixth are checks on committed files -- the abbreviation catalogue, the
      # claim linter, the figure audit, the film spec, the handoff gate, the
      # published-figure check -- and none of them can answer differently on a
      # different interpreter. They were being paid for twice: sixty-five
      # tests, and this step went from 63 seconds to 44 when it stopped paying
      # for them -- both figures read off this step itself, in the lane, not
      # projected from a laptop. `markers` in `pyproject.toml` carries the
      # measurement, what it declines to attribute, and the trade this gives
      # up. Same argument the `gate` job below makes for
      # lint, format, rules and the page audits, applied to the gates that
      # happen to live inside the suite. `markers` in `pyproject.toml` carries
      # the trade this gives up.
      - name: Tests
        if: matrix.python-version != '3.13'
        run: pytest -q -m "not gate"

      - name: Tests with coverage
        if: matrix.python-version == '3.13'
        run: pytest -q --cov --cov-report=term

  # Everything whose answer does not depend on the interpreter, once.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,mcp,dev]"

      # The whole tree, `web/` included: the page modules are Python that
      # assembles the site, and a carve-out is a rule nobody remembers.
      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      # `py.typed` ships in the wheel, which tells every downstream project
      # that runs a type checker that these annotations are maintained. The
      # marker shipped for months against twenty-five errors and no step --
      # a claim with no gate, which is the one thing this repository does not
      # allow itself anywhere else. Configuration, including the three
      # stub-less upstreams it skips by name, is in `pyproject.toml`.
      - name: Type check
        run: mypy

      # The rules ship with their own examples, so the rule set is itself
      # under test. A regular expression that silently stops matching is a
      # guardrail that silently disappears, and this is what catches it.
      - name: Rule evidence
        run: ai-bunker rules --check

      # The dashboard's two gates. Deterministic, no browser, no model.
      - name: Dashboard contrast
        run: python scripts/audit_contrast.py

      - name: Dashboard accessibility
        run: python scripts/lint_a11y.py

      # The site's figures are a separate problem: their text sits on tints of
      # the brand colours themselves, so a token that passes against white can
      # fail against its own card. The failures are light-scheme-only, which is
      # precisely what a review done in dark mode cannot see.
      - name: Figure contrast
        run: python scripts/audit_figures.py

      # A deployment claim that nobody checks is a deployment claim that
      # drifts. `doctor` returns non-zero only on a broken rule set, so an
      # unreachable upstream in CI is a warning rather than a failure.
      - name: Doctor
        run: ai-bunker doctor --config config/gateway.example.yaml

      # The text-to-image slot used to be checked here against the provider's
      # development branch, by two steps that pip-installed
      # `best-engine-ai-helper` from git and re-ran two test modules. The
      # reason was that `imagine_rank` and `imagine_pick` -- the selector this
      # project delegates the whole slot to -- existed on that branch and in no
      # published release, so seven tests skipped under the version a user
      # actually gets.
      #
      # 1.10.0 publishes them. `pyproject.toml` floors the dependency there,
      # the seven tests run in the suite above like every other test, and the
      # workaround is deleted exactly as its own comment instructed. What the
      # lane gives up is advance warning of a change on the provider's
      # unreleased branch; what it gains is one less way to go red for an
      # upstream reason, and a slot that is tested against the artefact a user
      # installs rather than against a branch.
