# ai-bunker — the launch film, as a file a reviewer can diff.
#
# The film's closing line is "every number in this film is in the repository,
# and a test fails when one of them drifts". This is what makes that true
# rather than charming. `make-film verify video/film.yaml --root .` reads each
# claim out of the file that decides it; exit 1 means the film is lying.
#
# Two claims were corrected before the first render by writing this file:
#   - "thirteen hundred tests" was 1,140;
#   - "972 tokens, three percent" is a real measurement that moves whenever
#     the charter is edited, so the film states the claim that is *gated*
#     ("under 5% of the window") instead of the one that is merely true today.
#
# That is the whole argument for the spec existing: it caught two drifts
# before a single frame was drawn.

name: ai-bunker-launch

claims:
  - text: "40,433 tokens"
    value: "40,433 tokens"
    source: { path: README.md, method: literal, selector: "40,433 tokens" }

  - text: "a server configured for 32,768"
    value: "32,768"
    source: { path: README.md, method: literal, selector: "32,768" }

  - text: "the gap measured 55%"
    value: "The gap was 55%."
    source: { path: README.md, method: literal, selector: "The gap was 55%." }

  - text: "59 agent skills cost 17,754 tokens"
    value: "17,754 tokens"
    source: { path: README.md, method: literal, selector: "17,754 tokens" }

  - text: "eight tokens a turn"
    value: "8 tokens per turn"
    source: { path: README.md, method: literal, selector: "8 tokens per turn" }

  - text: "the charter and the index cost under five percent of the window"
    value: "and the index cost under 5% of the window"
    source:
      path: README.md
      method: literal
      selector: "and the index cost under 5% of the window"

  # The count in the film, read from the line `scripts/sync_counts.py` writes
  # and `tests/test_site.py` gates against what pytest actually collects. Three
  # links, and the film is the last one.
  - text: "1,212 tests"
    value: "1212 tests, `ruff` clean"
    source:
      path: README.md
      method: literal
      selector: "1212 tests, `ruff` clean"

  # Found by `make-film scan`, not by remembering: four figures were on
  # screen that no claim accounted for. That is the half of the audit that
  # catches the number typed into a keyframe at midnight, and it caught these.
  - text: "compaction fires at 20,000"
    value: "= compaction starts at                      20000"
    source:
      path: README.md
      method: literal
      selector: "= compaction starts at                      20000"

  - text: "tool schemas (7) — 3,164"
    value: "3164 tokens"
    source: { path: README.md, method: literal, selector: "3164 tokens" }

  - text: "charter — 905"
    value: "905 tokens"
    source: { path: README.md, method: literal, selector: "905 tokens" }

  - text: "knowledge index — 353"
    value: "353 tokens"
    source: { path: README.md, method: literal, selector: "353 tokens" }

  # The three below were on screen from the first render and declared by
  # nothing. `make-film scan` reported all three and the report went nowhere:
  # the first pass declared the four figures of the budget table and left the
  # rest, which is how a scan that finds twelve gets written up as finding
  # four. `scripts/lint_film.py` now runs the same scan in the suite, so the
  # next one cannot be left.

  # The incident date, which is the one claim no literal search for the film's
  # wording could ever have found: the film says "25 September 2026" and the
  # README says `2026-09-25`. A spec is exactly the place where two notations
  # of one fact are reconciled, and this is the pair that proves it earns its
  # keep.
  - text: "25 September 2026"
    value: "On 2026-09-25,"
    source: { path: README.md, method: literal, selector: "On 2026-09-25," }

  # The card the sizing beat is about, read from the generator that draws the
  # figure rather than from the prose that describes it -- `make_figures.py
  # --check` already refuses to let that file drift from the committed SVG, so
  # this claim inherits a gate instead of needing a new one.
  - text: "one H100, 80 GiB, every slot filled"
    value: "ONE H100 80 GiB, EVERY SLOT FILLED"
    source:
      path: scripts/make_figures.py
      method: literal
      selector: "ONE H100 80 GiB, EVERY SLOT FILLED"

  # And what asking for pictures costs: the coder it displaces. Same file, same
  # reason. Without this the film could keep saying "80B" after the catalogue
  # had moved to a different mixture-of-experts.
  - text: "the coder drops from the 80B mixture-of-experts"
    value: "the coder drops from the 80B"
    source:
      path: scripts/make_figures.py
      method: literal
      selector: "the coder drops from the 80B"

  - text: "BSD-3-Clause"
    value: "BSD-3-Clause"
    source: { path: pyproject.toml, method: literal, selector: "BSD-3-Clause" }

  # Four stages, counted in the generator that draws them rather than in the
  # prose that describes them: the figure and the film then cannot disagree.
  - text: "a turn crosses the gateway four times"
    value: 4
    source:
      path: scripts/make_figures.py
      method: regex_count
      selector: '\("0[1-9]", "(?:orange|blue)", \d+,'

  - text: "the coder drops to devstral-small-2-24b"
    value: "devstral-small-2-24b"
    source:
      path: scripts/make_figures.py
      method: literal
      selector: "devstral-small-2-24b"

  - text: "deraison.ai/ai-helpers"
    value: "https://deraison.ai/ai-helpers"
    source:
      path: pyproject.toml
      method: literal
      selector: "https://deraison.ai/ai-helpers"

  - text: "github.com/warith-harchaoui/ai-bunker"
    value: "https://github.com/warith-harchaoui/ai-bunker"
    source:
      path: pyproject.toml
      method: literal
      selector: "https://github.com/warith-harchaoui/ai-bunker"

# Figures on screen that are ordinals rather than quantities: the stage numbers
# of the pipeline beat. They are not claims -- nothing in the repository says
# "02", the generator says there are four stages and a claim above counts them
# -- but they are digits in front of a viewer, so the scan would otherwise be
# silent about them or noisy forever.
#
# The list is this short on purpose. Adding a fifth stage to the diagram puts
# `05` on screen and turns `scripts/lint_film.py` red, which is the correct
# answer: a film that shows five stages while the gateway has four is the exact
# drift this file exists to catch.
labels:
  - shown: "01"
    why: "pipeline stage ordinal; the count itself is claimed above"
  - shown: "02"
    why: "pipeline stage ordinal"
  - shown: "03"
    why: "pipeline stage ordinal"
  - shown: "04"
    why: "pipeline stage ordinal"

assets:
  # Paths are relative to the composition tree (`video/film`), which is what
  # `make-film assets --tree video/film --repo .` resolves them against.
  #
  # Only what the film actually renders from. `figure-budget.svg` and
  # `figure-pipeline.svg` were listed here and are not used: those two beats
  # are built natively in the composition because the thing that has to land
  # in them is the motion -- a floor crossing a line, four stages arriving in
  # order -- and a static import cannot move.
  - rel: assets/figure-path.svg
    provenance: derived
    why: "written by scripts/make_figures.py; `make_figures.py --check` fails if it drifts"
  - rel: assets/figure-plan.svg
    provenance: derived
    why: "written by scripts/make_figures.py; `make_figures.py --check` fails if it drifts"
  # Byte-identical to `assets/logo-dark.png` at the repository root (same
  # sha1). `make-film assets` reports it as diverged because it cannot resolve
  # the counterpart from inside `--tree`; the file is correct and the finding
  # is the tool's, which is worth writing down rather than silencing by
  # relabelling a true provenance as something else.
  - rel: assets/logo-dark.png
    provenance: tracked
  - rel: narration/lines.txt
    provenance: sole
    why: >-
      The spoken script, authored for this film and living nowhere else. It is
      what `sprezzature-audio narrate` reads, so losing it means the narration
      cannot be regenerated even in principle.
  - rel: narration/narration.mp3
    provenance: sole
    why: >-
      Generated once by `sprezzature-audio narrate` from `narration/lines.txt`,
      and every beat boundary in the film is cut to the measured length of its
      segments. Kokoro is not guaranteed to produce the same waveform across
      versions, so regenerating it would silently change the cut. Tracked at
      128 kbit/s rather than the 5.4 MB original.
  - rel: narration/narration.vtt
    provenance: derived
    why: "written beside the audio by the same run; the film's timing reads it"
