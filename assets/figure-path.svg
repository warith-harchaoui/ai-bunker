<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" role="img"
     aria-labelledby="path-t path-d">
  <title id="path-t">Four positions on one path, and only one sees both ends</title>
  <desc id="path-d">A turn travelling left to right through four boxes: a coding agent, the gateway position, a serving engine and the tool servers. Under each box, the tools that stand there — client-side configuration and guardrail libraries at the agent; LiteLLM, Kong, Portkey, Bifrost, agentgateway, the Envoy AI Gateway and ai-bunker at the gateway; ToolHive, the Docker MCP Gateway and agent-scan around the tool servers. The serving engine has nothing standing at it.</desc>
  <style>
    svg { font-family: Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    text { font-size: 12px; }
    .t { font-size: 13px; font-weight: 600; }
    .s { font-size: 11.5px; }
    .n { font-size: 11px; font-weight: 700; letter-spacing: .1em; }
    .h { font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .band { fill-opacity: 0.05; stroke-opacity: .30; }
    .card-blue, .card-orange { fill-opacity: 0.10; }
    .card-blue { stroke-opacity: .45; }
    .card-orange { stroke-opacity: .50; }
    .outline { fill: none; stroke-width: 1.5; }
    .wire, .wire-back { fill: none; stroke-width: 2; }
    .axis { fill: none; stroke-width: 1; }
    .dash { fill: none; stroke-width: 1; stroke-dasharray: 4 4; }
    text { fill: #1B1B1F; }
    .muted { fill: #656569; }
    .blue { fill: #0062CC; }
    .orange { fill: #995600; }
    .red { fill: #C12F26; }
    .green { fill: #158126; }
    .band, .card-blue { fill: #0062CC; stroke: #0062CC; }
    .card-orange { fill: #995600; stroke: #995600; }
    .outline, .wire-back, .axis, .dash { stroke: #656569; }
    .wire { stroke: #0062CC; }
    .seg-muted { fill: #656569; stroke: #656569; }
    .seg-blue { fill: #0062CC; stroke: #0062CC; }
    .seg-orange { fill: #995600; stroke: #995600; }
    .seg-red { fill: #C12F26; stroke: #C12F26; }
    .seg-green { fill: #158126; stroke: #158126; }
    .dot-blue { fill: #0062CC; }
    .dot-red { fill: #C12F26; }
    .head-fwd { fill: #0062CC; }
    .head-back { fill: #656569; }
    @media (prefers-color-scheme: dark) {
      text { fill: #E8E8EA; }
      .muted { fill: #92929A; }
      .blue { fill: #3C9BFF; }
      .orange { fill: #FFA52B; }
      .red { fill: #FF5349; }
      .green { fill: #35D94E; }
      .band, .card-blue { fill: #3C9BFF; stroke: #3C9BFF; }
      .card-orange { fill: #FFA52B; stroke: #FFA52B; }
      .outline, .wire-back, .axis, .dash { stroke: #92929A; }
      .wire { stroke: #3C9BFF; }
      .seg-muted { fill: #92929A; stroke: #92929A; }
      .seg-blue { fill: #3C9BFF; stroke: #3C9BFF; }
      .seg-orange { fill: #FFA52B; stroke: #FFA52B; }
      .seg-red { fill: #FF5349; stroke: #FF5349; }
      .seg-green { fill: #35D94E; stroke: #35D94E; }
      .dot-blue { fill: #3C9BFF; }
      .dot-red { fill: #FF5349; }
      .head-fwd { fill: #3C9BFF; }
      .head-back { fill: #92929A; }
    }
  </style>
  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
      <path class="head-fwd" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
      <path class="head-back" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <text class="h blue" x="60" y="38">WHERE A TURN CAN BE READ, AND BY WHOM</text>
  <text class="s muted" x="60" y="58">the same field as the positioning map, placed on the path instead of in a space</text>
  <rect class="outline" x="28.0" y="92" width="197.0" height="60" rx="12"/>
  <text class="t" x="126.5" y="118" text-anchor="middle">Coding agent</text>
  <text class="s muted" x="126.5" y="138" text-anchor="middle">any OpenAI-compatible client</text>
  <rect class="card-blue" x="245.0" y="92" width="200.0" height="60" rx="12"/>
  <text class="t blue" x="345.0" y="118" text-anchor="middle">The gateway position</text>
  <text class="s muted" x="345.0" y="138" text-anchor="middle">every request, no opt-out</text>
  <rect class="outline" x="465.0" y="92" width="185.0" height="60" rx="12"/>
  <text class="t" x="557.5" y="118" text-anchor="middle">Serving engine</text>
  <text class="s muted" x="557.5" y="138" text-anchor="middle">vLLM, Ollama, anything</text>
  <rect class="outline" x="670.0" y="92" width="200.0" height="60" rx="12"/>
  <text class="t" x="770.0" y="118" text-anchor="middle">Tool servers</text>
  <text class="s muted" x="770.0" y="138" text-anchor="middle">MCP, the shell, the world</text>
  <path class="wire" d="M225 122 H245" marker-end="url(#fwd)"/>
  <path class="wire" d="M445 122 H465" marker-end="url(#fwd)"/>
  <path class="wire" d="M650 122 H670" marker-end="url(#fwd)"/>
  <text class="n muted" x="28" y="172">WHO STANDS THERE</text>
  <text class="s muted" x="28.0" y="192">Client-side config</text>
  <text class="s muted" x="28.0" y="212">Guardrail libraries</text>
  <text class="s muted" x="245.0" y="192">LiteLLM · Kong · Portkey</text>
  <text class="s muted" x="245.0" y="212">Bifrost · agentgateway</text>
  <text class="s muted" x="245.0" y="232">Envoy AI Gateway</text>
  <text class="s blue" x="245.0" y="252">ai-bunker</text>
  <text class="s muted" x="670.0" y="192">ToolHive</text>
  <text class="s muted" x="670.0" y="212">Docker MCP Gateway</text>
  <text class="s muted" x="670.0" y="232">agent-scan</text>
  <text class="s muted" x="60" y="298">Four positions, and they are not interchangeable. A file on a laptop drifts. A library runs only when the application remembers to call it. A</text>
  <text class="s muted" x="60" y="316">tool-server gateway sees a call the model has already decided to make. Only the gateway position sees every request, from every client, at both</text>
  <text class="s muted" x="60" y="334">ends of the turn — and most of what stands there forwards the bytes without reading them. Open Policy Agent is consulted from anywhere and stands here nowhere.</text>
</svg>
